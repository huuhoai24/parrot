[project]
name = "parrot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asgi-autoreload[fastapi]>=0.1.2",
    "datasets<4",
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "librosa>=1.0.0",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
    "webvtt-py>=0.5.1",
    "yt-dlp[default]>=2026.8.19",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"


[tool.uv.workspace]
members = [
    "1",
]
