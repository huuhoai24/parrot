<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/base.css">
</head>
<body>
  {% include "_navbar.html" %}
  <div class="player-shell">
      <form id="search-form">
        <div class="input-group input-group-lg">
          <input class="form-control" name="q" type="text" placeholder="Search for..." autocomplete="off">
          <span class="input-group-btn">
            <button type="submit" class="btn btn-lg btn-search">
              <span class="glyphicon glyphicon-search"></span> Say it!
            </button>
        </div>
      </form>

      <h2 class="pronounce-header" hidden>
        How to pronounce <span id="current-word" class="current-word"></span> in English
        (<span id="current-index">1</span> out of <span id="total-count">0</span>)
      </h2>

      <div id="yt-player"></div>
      <div class="control-bar">
        <div class="control-buttons">
          <div><img id="btn-prev" src="/static/img/previous_vs2.png" alt="Previous"></div>
          <div><img id="btn-back-5" src="/static/img/back_5.png" alt="Previous5s"></div>
          <div><img id="btn-replay" src="/static/img/replay.png" alt="Replay"></div>
          <div><img id="btn-play" src="/static/img/play.png" alt="Play/Pause"></div>
          <div><img id="btn-next" src="/static/img/next_vs2.png" alt="Next"></div>
        </div>
        <div class="control-right">
          <button id="btn-save" class="btn-save" type="button" title="Lưu cụm từ thành thẻ học">Save</button>
          <div class="control-speed">Speed: Normal</div>
        </div>
      </div>
      <div class="caption"> <div id="caption-text" class="caption-text"></div></div>
  </div>


    <script src="/static/js/player.js"></script>
    <script src="/static/js/search.js"></script>
    <script src="/static/js/transcript.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
